services:
  web:
    build: .
    image: inventory-agent:local
    container_name: inventory-agent-local
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - inventory-data:/data
    restart: unless-stopped
volumes:
  inventory-data:
