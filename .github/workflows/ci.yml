name: Inventory Agent CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run tests without a real API key
        run: python manage.py test --verbosity 2
      - name: Build container
        run: docker build -t inventory-agent:test .
      - name: Smoke-test container and persistent database
        run: |
          docker run -d --name inventory-ci -p 127.0.0.1:8000:8000 inventory-agent:test
          trap 'docker logs inventory-ci; docker rm -f inventory-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health/; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health/
          curl --fail http://127.0.0.1:8000/

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Select immutable image tag
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker build --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} -t "$IMAGE" -t "${IMAGE%:*}:latest" .
          docker push "$IMAGE"
          docker push "${IMAGE%:*}:latest"

  deploy:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, inventory-deploy]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy tested commit and verify health
        shell: powershell
        env:
          INVENTORY_IMAGE: ${{ needs.publish.outputs.image }}
        run: ./scripts/deploy.ps1 -Image $env:INVENTORY_IMAGE -EnvFile "$env:USERPROFILE/.inventory-agent.env"
